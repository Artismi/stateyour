<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stateyour — la grammatica delle piastrelle</title>
<style>
  :root { --carta: #f4f1ea; --inchiostro: #1c1b18; --grigio: #8a867c; --riga: #d8d3c6; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--carta); color: var(--inchiostro); }
  header { padding: 14px 20px 6px; border-bottom: 1px solid var(--riga); display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header span { color: var(--grigio); }
  header a { color: var(--grigio); margin-left: auto; }
  main { display: grid; grid-template-columns: 1fr 380px; min-height: calc(100vh - 48px); }
  .quadro { padding: 14px 20px; display: grid; grid-template-columns: 1fr 300px; gap: 14px; align-items: start; }
  canvas { display: block; width: 100%; height: auto; background: #fbfaf6; }
  #parola { grid-column: 1 / -1; padding: 10px 12px; border: 1px solid var(--riga); background: #fff; white-space: pre-wrap; font-size: 13px; }
  .scomposizione { font-size: 12px; color: var(--grigio); }
  .scomposizione div { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .scomposizione i { display: inline-block; width: 14px; height: 3px; }
  aside { border-left: 1px solid var(--riga); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  label { display: block; color: var(--grigio); font-size: 12px; margin-bottom: 3px; }
  select, textarea, button { font: inherit; width: 100%; border: 1px solid var(--riga); background: #fff; color: var(--inchiostro); padding: 6px 8px; border-radius: 3px; }
  textarea { height: 420px; resize: vertical; font-size: 12px; line-height: 1.35; white-space: pre; }
  button { cursor: pointer; background: var(--inchiostro); color: var(--carta); border-color: var(--inchiostro); }
  #errore { color: #b8412b; font-size: 12px; white-space: pre-wrap; }
  @media (max-width: 900px) { main, .quadro { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--riga); } }
</style>
</head>
<body>
<header>
  <h1>stateyour · piastrelle</h1>
  <span>la grammatica compone lo stato, il seme lo contiene tutto, una sola simulazione lo fa crescere</span>
  <a href="./index.html">← il motore</a>
</header>
<main>
  <section class="quadro">
    <canvas id="reticolo" width="900" height="600"></canvas>
    <div>
      <canvas id="cella" width="300" height="300"></canvas>
      <div class="scomposizione" id="scomposizione"></div>
    </div>
    <div style="grid-column: 1 / -1">
      <label for="tempo">tempo <output id="otempo"></output></label>
      <input type="range" id="tempo" min="0" max="1" step="0.01" value="1" style="width:100%">
    </div>
    <div id="parola"></div>
  </section>
  <aside>
    <div>
      <label for="scelta">piastrella</label>
      <select id="scelta"></select>
    </div>
    <div>
      <label for="json">codifica (JSON, modificabile)</label>
      <textarea id="json" spellcheck="false"></textarea>
    </div>
    <button id="genera">genera dalla codifica</button>
    <button id="scarica" style="background:#fff;color:var(--inchiostro)">scarica il seme (.json)</button>
    <div id="errore"></div>
  </aside>
</main>
<script type="module" src="./src/piastrelle.js"></script>
</body>
</html>
