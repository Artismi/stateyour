<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stateyour</title>
<style>
  :root { --carta: #f4f1ea; --inchiostro: #1c1b18; --grigio: #8a867c; --riga: #d8d3c6; --accento: #d0532f; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--carta); color: var(--inchiostro); height: 100vh; display: flex; flex-direction: column; }
  button, select, input { font: inherit; }
  button { border: 1px solid var(--riga); background: #fff; color: var(--inchiostro); padding: 5px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--inchiostro); }
  button.primo { background: var(--accento); color: #fff; border-color: var(--accento); }
  input[type=number] { width: 72px; padding: 3px; border: 1px solid var(--riga); border-radius: 3px; }
  select { padding: 3px; border: 1px solid var(--riga); border-radius: 3px; background: #fff; }
  /* la barra in alto (sotto il visore non si vede) */
  header { padding: 6px 12px; border-bottom: 1px solid var(--riga); display: flex; gap: 10px; align-items: center; }
  header h1 { font-size: 15px; margin: 0 6px 0 0; letter-spacing: .02em; }

  main { flex: 1; display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
  .scena { display: flex; flex-direction: column; min-height: 0; }
  .tele { flex: 1; position: relative; min-height: 0; overflow: hidden; }
  .tele canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .tele canvas[hidden] { display: none; }

  /* in basso a destra: un punto a caso */
  .modo { position: absolute; right: 10px; bottom: 10px; display: flex; }
  .modo button { border-radius: 0; margin-left: -1px; font-size: 12px; padding: 3px 9px; }
  .modo button:first-child { border-radius: 4px 0 0 4px; } .modo button:last-child { border-radius: 0 4px 4px 0; }
  .modo button.attivo { background: var(--inchiostro); color: var(--carta); border-color: var(--inchiostro); }
  ol.catena { padding-left: 18px; } ol.catena li { margin-bottom: 6px; }

  .stato { font-size: 12px; padding: 6px 12px; border-top: 1px solid var(--riga); display: flex; gap: 14px; align-items: baseline; height: 6.4em; flex: none; overflow-y: auto; } /* (alta sempre uguale: la tela non cambia grandezza quando cambia il testo, e lo zoom resta continuo) */
  #dove { color: var(--inchiostro); }
  /* il percorso dell'indirizzo nello spazio: ogni voce porta lì in volo; ↑ al livello sopra */
  .briciole3d { flex: none; max-width: 46%; }
  .briciole3d button { font: inherit; padding: 0; border: none; background: none; color: var(--inchiostro); border-bottom: 1px dotted var(--grigio); border-radius: 0; }
  .briciole3d button:hover { color: var(--accento); border-color: var(--accento); }
  .briciole3d button.su { border: 1px solid var(--riga); border-radius: 3px; padding: 0 6px; margin-right: 8px; }
  .briciole3d b { font-weight: 600; }
  .briciole3d i { font-style: normal; color: var(--grigio); margin: 0 4px; }
  /* sopra lo spazio: il prossimo bersaglio (un anello e il suo nome) e le etichette che svaniscono con la grandezza */
  .segni3d { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; font: 11px ui-monospace, monospace; color: #f3efe6; text-shadow: 0 0 3px #000, 0 0 2px #000; }
  .segni3d .anello { position: absolute; border: 1px solid rgba(243, 239, 230, 0.55); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 2px rgba(0, 0, 0, 0.6); }
  .segni3d .anello.fermo { border-color: rgba(208, 83, 47, 0.9); }
  .segni3d span { position: absolute; white-space: nowrap; transform: translate(-50%, 0); }
  .segni3d span.meta { font-size: 12px; }
  /* la barra di scala vera: una riga sola, sempre, in ogni vista (laboratorio.js, barraDiScala) */
  .barra-scala { position: absolute; left: 12px; bottom: 10px; z-index: 4; pointer-events: none; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 450px); /* (non sotto i bottoni in basso a destra) */ font: 12px ui-monospace, monospace; color: #f3efe6; text-shadow: 0 0 3px #000, 0 0 2px #000; white-space: nowrap; }
  .barra-scala i { display: block; height: 6px; border: 1.5px solid #f3efe6; border-top: none; box-shadow: 0 1px 2px #000; flex: none; }
  .barra-scala span { overflow: hidden; text-overflow: ellipsis; }
  #errore { color: #b8412b; }

  aside { border-left: 1px solid var(--riga); overflow-y: auto; overflow-x: hidden; padding: 8px 12px 40px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--grigio); margin: 16px 0 6px; font-weight: 600; }
  aside h2:first-child { margin-top: 4px; }
  .nota { color: var(--grigio); font-size: 12px; margin: 4px 0; }
  .aiuto { font-size: 12px; background: #fff; border: 1px solid var(--riga); padding: 8px; border-radius: 3px; }
  .riga-bottoni { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .briciole { display: flex; gap: 8px; align-items: center; margin: 2px 0 8px; }</style>
<link rel="stylesheet" href="./src/visore/visore.css"><!-- il visore (PROGETTO_VISORE.md, variante B): veste la camera -->
</head>
<body>
<header>
  <h1>stateyour</h1>
</header>
<main>
  <section class="scena">
    <div class="tele">
      <canvas id="tela"></canvas>
      <div id="barraScala" class="barra-scala" title="la grandezza vera di ciò che si guarda"></div>
      <div class="modo"><button id="puntoACaso" title="un punto a caso dell'universo, scelto con la misura della lingua (LINGUA.md): si apre lì, e in basso si leggono il suo indirizzo e i suoi bit">🎲 un punto a caso</button></div>
    </div>
    <div class="stato"><span id="briciole" class="briciole3d" hidden></span><span id="dove"></span><span id="errore"></span></div>
  </section>
  <aside id="pannello"></aside>
</main>

<script type="module" src="./src/camera/laboratorio.js"></script>
<script type="module" src="./src/visore/visore.js"></script>
</body>
</html>
