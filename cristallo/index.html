<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cristallo</title>
<style>
  :root { --fondo: #04060c; --vetro: rgba(18, 24, 40, 0.78); --bordo: rgba(140, 170, 255, 0.18); --testo: #dfe7ff; --collina: #ffb04a; --conca: #a07cff; --magnete: #ff5c8a; --pallina: #ffffff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--testo); font-family: system-ui, "Segoe UI", sans-serif; overflow: hidden; user-select: none; touch-action: none; }
  #tela, #sopra { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 118px); }
  #sopra { cursor: crosshair; }
  #frasi { position: absolute; left: 0; right: 0; bottom: 126px; text-align: center; pointer-events: none; }
  #frase { font-size: 22px; letter-spacing: 0.02em; color: #eaf0ff; text-shadow: 0 0 12px rgba(120,160,255,0.6); opacity: 0.92; }
  #frase2 { font-size: 15px; color: #a9b8e8; margin-top: 4px; min-height: 18px; }
  #barra { position: absolute; left: 0; right: 0; bottom: 0; height: 118px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 12px;
    background: linear-gradient(to top, rgba(10,14,26,0.98), rgba(10,14,26,0.9)); border-top: 1px solid var(--bordo); }
  .tasto { width: 76px; height: 76px; border-radius: 22px; border: 1px solid var(--bordo); background: var(--vetro); color: var(--testo); font-size: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .08s, background .2s; padding: 0; }
  .tasto:active { transform: scale(0.93); }
  .tasto.acceso { background: rgba(70, 100, 190, 0.55); border-color: rgba(170, 200, 255, 0.6); }
  .manopola { display: flex; align-items: center; gap: 4px; height: 76px; padding: 0 12px; border-radius: 22px; border: 1px solid var(--bordo); background: var(--vetro); }
  .manopola span { font-size: 34px; }
  .manopola input { -webkit-appearance: none; appearance: none; width: 84px; height: 14px; border-radius: 7px; background: rgba(255,255,255,0.14); outline: none; }
  .manopola input::-webkit-slider-thumb { -webkit-appearance: none; width: 42px; height: 42px; border-radius: 50%; background: #e8eeff; box-shadow: 0 0 12px rgba(160,190,255,0.8); cursor: pointer; }
  #m-magnete input::-webkit-slider-thumb { background: var(--magnete); box-shadow: 0 0 14px rgba(255,92,138,0.9); }
  #m-velocita input::-webkit-slider-thumb { background: #7fe0ff; }
  #m-caldo input::-webkit-slider-thumb { background: linear-gradient(135deg, #9fdcff, #ff9a5a); }
  #alto { position: absolute; top: 14px; right: 14px; display: flex; gap: 10px; }
  #alto .tasto { width: 64px; height: 64px; font-size: 30px; border-radius: 18px; }
  .tasto:disabled { opacity: 0.3; }
  .vassoio { position: absolute; bottom: 130px; background: rgba(12,16,30,0.94); border: 1px solid var(--bordo); border-radius: 26px; padding: 18px; display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
  .vassoio.aperto { display: block; }
  #v-cristallo { left: 16px; }
  #v-globo { left: 50%; transform: translateX(-50%); }
  #v-chiuse { right: 16px; }
  .orbita { width: 96px; height: 96px; border-radius: 16px; border: 1px solid var(--bordo); background: rgba(255,255,255,0.04); cursor: pointer; }
  .orbita.scelta { background: rgba(90,130,230,0.45); border-color: rgba(190,210,255,0.8); }
  #frase-globo { text-align: center; font-size: 17px; color: #cfe0ff; margin-top: 10px; min-height: 22px; }
  .forme { display: flex; gap: 10px; margin-bottom: 14px; }
  .forma { width: 74px; height: 74px; border-radius: 18px; border: 1px solid var(--bordo); background: rgba(255,255,255,0.04); cursor: pointer; padding: 0; }
  .forma.scelta { background: rgba(90, 130, 230, 0.45); border-color: rgba(190, 210, 255, 0.8); }
  .riga { display: flex; gap: 18px; align-items: center; }
  #info { position: absolute; top: 90px; right: 14px; width: 440px; max-height: calc(100% - 230px); overflow: auto; background: rgba(10,14,26,0.95); border: 1px solid var(--bordo); border-radius: 18px; padding: 16px 18px; font-size: 13px; line-height: 1.5; display: none; color: #c8d3f5; }
  #info.aperto { display: block; }
  #info h3 { margin: 10px 0 4px; font-size: 14px; color: #fff; }
  #info code, #info textarea { font-family: ui-monospace, monospace; font-size: 11.5px; }
  #info textarea { width: 100%; height: 110px; background: #070a14; color: #cfe; border: 1px solid var(--bordo); border-radius: 8px; padding: 6px; }
  #info button { margin-top: 6px; background: #22305a; color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .sep { width: 1px; height: 64px; background: var(--bordo); margin: 0 2px; }
</style>
</head>
<body>
<canvas id="tela"></canvas>
<canvas id="sopra"></canvas>
<div id="frasi"><div id="frase"></div><div id="frase2"></div></div>

<div id="alto">
  <button class="tasto" id="t-indietro" title="indietro">↩</button>
  <button class="tasto" id="t-avanti" title="avanti">↪</button>
  <button class="tasto" id="t-info" title="per i grandi">ⓘ</button>
</div>
<div id="info"></div>

<div class="vassoio" id="v-cristallo">
  <div class="forme" id="forme"></div>
  <canvas id="cubetto"></canvas>
</div>
<div class="vassoio" id="v-globo">
  <div class="riga">
    <canvas id="globo" width="270" height="270"></canvas>
    <div>
      <canvas id="cubetto2" width="220" height="200"></canvas>
      <div class="manopola" id="m-distanza" style="margin-top:10px"><span>🚇</span><input type="range" min="0" max="1000" value="300"><span>🖼️</span></div>
    </div>
  </div>
  <div id="frase-globo"></div>
</div>

<div class="vassoio" id="v-chiuse">
  <div class="riga" style="margin-bottom:12px"><button class="tasto" id="t-campo" title="controcampo">🎨</button><button class="tasto" id="t-pallina2" title="torna alla pallina">⚪</button><div id="chiuse-stato" style="font-size:28px"></div></div>
  <div id="catalogo" style="display:grid;grid-template-columns:repeat(6,96px);gap:10px;max-width:640px"></div>
</div>

<div id="barra">
  <button class="tasto" id="t-cristallo" title="cristallo">🧊</button>
  <button class="tasto" id="t-pallina" title="una pallina o una sorgente simmetrica">⚪</button>
  <div class="manopola" id="m-magnete"><span>🧲</span><input type="range" min="0" max="1000" value="0"></div>
  <div class="manopola" id="m-velocita"><span>🐢</span><input type="range" min="0" max="1000" value="500"><span>🐇</span></div>
  <div class="manopola" id="m-caldo"><span>❄️</span><input type="range" min="0" max="1000" value="0"><span>🔥</span></div>
  <button class="tasto" id="t-globo" title="da dove guardi">🌐</button>
  <button class="tasto" id="t-vista" title="tessera / viaggio">🧩</button>
  <button class="tasto" id="t-scheletro" title="lo scheletro del cristallo">🦴</button>
  <button class="tasto" id="t-chiuse" title="linee chiuse">⭕</button>
  <button class="tasto" id="t-caso" title="sorprendimi">🎲</button>
</div>
<script type="module" src="src/ui/app.js"></script>
</body>
</html>
